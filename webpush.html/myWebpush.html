<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myWebpush</title>
</head>
<body>
    <div>
        <div style="display: flex;">
            <div style="display: flex;flex-direction: column;">
                <h5>公開鍵＆秘密鍵<sub>サーバー生成</sub></h5>
                <p id="pubkey">公開鍵</p>
                <input type="text">
                <p>秘密鍵</p>
                <input type="text">
                <input type="button" value="変換" onclick="changeVAPID()">
            </div>
            <div style="display: flex;flex-direction: column;">
                <h5>VAPID</h5>
                <p>VAPID</p>
                <input type="text" readonly id="vapid">
                <input type="button" value="サービスワーカーへ登録">
            </div>
            <div style="display: flex;flex-direction: column;">
                <h5>サービスワーカー</h5>
                <p>サービスワーカーのPush</p>
                <span>エンドポイント</span>
                <input type="text" readonly id="endpoint">
                <span>公開鍵<sub>クライアント生成</sub></span>
                <input type="text" readonly id="p256dh">
                <span>セキュリティ強化用</span>
                <input type="text" readonly id="auth">
            </div>
        </div>
        <div style="position: relative;">
            <h5>サービスワーカー</h5>
            <div id="SW_f">
                <p>登録</p>
                <span>サービスワーカーがまだ登録されていません。</span><br>
                <input type="button" value="ブラウザに登録">
            </div>
            <div id="SW_t">
                <p>OK</p>
                <span>サービスワーカーは登録済みです。</span><br>
                <input type="button" value="再登録">
                <input type="button" value="登録解除">
            </div>
        </div>
        <script>
            function checkSW(){
                document.querySelectorAll("[id^=SW_]").forEach(el=>el.style.display="none")

                if (!'serviceWorker' in navigator) {
                    alert("お使いのブラウザはサービスワーカーに対応していません。")
                    return 0
                }
                navigator.serviceWorker.getRegistrations().then(function(registrations) {        
                    document.querySelector("#SW_t").style.display="unset"
                }).catch( e =>{
                    document.querySelector("#SW_f").style.display="unset"
                });
            }
            checkSW();//即実行
        </script>
    </div>
</body>
<script>
    function changeVAPID(){
        const target = document.querySelector("#pubkey")
        if(!target.value) return alert("公開鍵が入力されていません。")
        document.querySelector("#vapid").value = urlB64ToUint8Array(target)
    }
</script>
<script>
    /** https://tech.excite.co.jp/entry/2021/06/30/104213より
     * トークンを変換するときに使うロジック
     * @param {*} base64String 
     */
    function urlB64ToUint8Array (base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding)
            .replace(/\-/g, '+')
            .replace(/_/g, '/');

        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);

        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    }
</script>
</html>
